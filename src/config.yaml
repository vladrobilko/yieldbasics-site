site:
  name: YieldBasics
  site: 'https://yieldbasics.com'
  base: '/'
  trailingSlash: false

  googleSiteVerificationId: null # Google Search Console verification ID (public, safe to commit)

# Default SEO metadata
metadata:
  title:
    default: YieldBasics
    template: '%s — YieldBasics'
  description: 'Compare crypto earn rates (APR / APY) across exchanges, DeFi and wallets, updated daily.'
  robots:
    index: true
    follow: true
  openGraph:
    site_name: YieldBasics
    images:
      - url: '~/assets/images/default.png'
        width: 1200
        height: 630
    type: website
  twitter:
    handle: '@Yield_Basics'
    site: '@Yield_Basics'
    cardType: summary_large_image

i18n:
  language: en
  textDirection: ltr

apps:
  blog:
    isEnabled: true # the blog engine powers /guides (posts in src/data/post)
    postsPerPage: 8

    post:
      isEnabled: true
      permalink: '/guides/%slug%' # Variables: %slug%, %year%, %month%, %day%, %hour%, %minute%, %second%, %category%
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'guides' # Blog main path, you can change this to "articles" (/articles)
      robots:
        index: true

    category:
      isEnabled: false # too few guides to group yet
      pathname: 'category' # Category main path /category/some-category, you can change this to "group" (/group/some-category)
      robots:
        index: true

    tag:
      isEnabled: false
      pathname: 'tag' # Tag main path /tag/some-tag, you can change this to "topics" (/topics/some-category)
      robots:
        index: false

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: null # or "G-XXXXXXXXXX"
    cloudflare:
      token: 'dd133a058b1449ebb085ded5391ec3c7' # Cloudflare Web Analytics (public, safe to commit)

ui:
  theme: 'system' # Values: "system" | "light" | "dark" | "light:only" | "dark:only"
