name: Deploy

# Builds the site and publishes it to GitHub Pages (yieldbasics.com, see
# public/CNAME) on every push to master: merged PRs, including the daily
# rates PR, go live automatically. Needs Settings → Pages → Source: GitHub Actions.

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push supersedes a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  indexnow:
    name: Notify search engines
    needs: deploy
    runs-on: ubuntu-latest
    # A failed ping must not mark the deploy as failed.
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whether the rates changed
        id: changed
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" != push ] || git diff --name-only "$BEFORE" HEAD | grep -qx 'src/data/rates.json'; then
            echo "ping=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.changed.outputs.ping == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.changed.outputs.ping == 'true'
        run: npm ci

      - name: Send IndexNow ping
        if: steps.changed.outputs.ping == 'true'
        run: npm run indexnow
