name: Update rates

# Once a day: fetch earn rates (npm run rates) and open or refresh one PR with
# the new src/data/rates.json for review. Merging it publishes the new rates.
# Needs Settings → Actions → General → "Allow GitHub Actions to create and
# approve pull requests". PRs opened with GITHUB_TOKEN don't trigger the CI
# workflow, so this job runs the tests and the build itself.
# Run it by hand with open_pr=false (e.g. on a branch, to test a source fix)
# to fetch and build without touching the rates PR; the summary is in the log.

on:
  schedule:
    # Off the hour: runs scheduled on the hour start hours late at peak load.
    # Even scheduled runs start up to ~5.5 hours late, so it is set late in the
    # evening for the PR to be ready before 05:00 UTC.
    - cron: '17 23 * * *' # 23:17 UTC
  workflow_dispatch:
    inputs:
      open_pr:
        description: Open or update the rates PR
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-rates
  cancel-in-progress: false

jobs:
  update:
    name: Fetch rates and open PR
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Keep the current rates
        # For the X post below: it is skipped when no rate changed.
        run: cp src/data/rates.json "$RUNNER_TEMP/previous-rates.json"

      - name: Fetch rates
        env:
          # Bybit blocks GitHub's runners; this is our Cloudflare Worker (see AGENTS.md).
          BYBIT_PROXY_URL: ${{ secrets.BYBIT_PROXY_URL }}
        run: npm run rates -- --summary "$RUNNER_TEMP/rates-summary.md" --hold "$RUNNER_TEMP/rates-hold.txt"

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      # The owner copies this post and its reply into X by hand (GitHub shows a
      # copy button on each code block). The same text can be posted
      # automatically later; see ROADMAP.md, "Daily posts on X".
      - name: Add the X post to the PR description
        run: |
          previous="$RUNNER_TEMP/previous-rates.json"
          text=$(npm run -s x:daily -- --previous "$previous" --text-only)
          reply=$(npm run -s x:daily -- --previous "$previous" --reply-only)
          if [ -n "$text" ]; then
            {
              printf '\n## Post for X\n\nCopy with the button at the top right of the box, then paste into X.\n\n'
              printf '```text\n%s\n```\n' "$text"
              printf '\nThen reply to your own post with:\n\n'
              printf '```text\n%s\n```\n' "$reply"
            } >> "$RUNNER_TEMP/rates-summary.md"
          fi

      - name: Date
        id: date
        # Named after the morning the PR is reviewed: a run that starts before
        # midnight UTC still gets the next day's date.
        run: echo "today=$(date -u -d '+6 hours' +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Open or update the rates PR
        id: pr
        if: github.event_name == 'schedule' || inputs.open_pr
        uses: peter-evans/create-pull-request@v7
        with:
          branch: feature/bot/daily-rates-update
          delete-branch: true
          add-paths: src/data/rates.json
          commit-message: Update earn rates (${{ steps.date.outputs.today }})
          title: Daily earn rates update (${{ steps.date.outputs.today }})
          body-path: ${{ runner.temp }}/rates-summary.md

      # GitHub emails the owner about the review request every day, and about
      # the @mention when the update needs a closer look (big moves, removed
      # offers or failed sources).
      - name: Ask the owner to review
        if: steps.pr.outputs.pull-request-number != '' && steps.pr.outputs.pull-request-operation != 'closed'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.pull-request-number }}
          OWNER: ${{ github.repository_owner }}
        run: |
          gh pr edit "$PR" --add-reviewer "$OWNER" || true
          if [ -s "$RUNNER_TEMP/rates-hold.txt" ]; then
            reasons=$(paste -sd ',' "$RUNNER_TEMP/rates-hold.txt" | sed 's/,/, /g')
            echo "Needs review: $reasons"
            gh pr comment "$PR" --body "@$OWNER this rates update needs a look before it goes live: $reasons."
          fi
