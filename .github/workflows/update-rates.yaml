name: Update rates

# Once a day: fetch earn rates (npm run rates) and open or refresh one PR with
# the new src/data/rates.json for review. Merging it publishes the new rates.
# Needs Settings → Actions → General → "Allow GitHub Actions to create and
# approve pull requests". PRs opened with GITHUB_TOKEN don't trigger the CI
# workflow, so this job runs the tests and the build itself.
# Run it by hand with open_pr=false (e.g. on a branch, to test a source fix)
# to fetch and build without touching the rates PR; the summary is in the log.

on:
  schedule:
    # Off the hour: runs scheduled on the hour start hours late at peak load.
    # Even scheduled runs start up to ~5.5 hours late, so it is set late in the
    # evening for the PR to be ready before 05:00 UTC.
    - cron: '17 23 * * *' # 23:17 UTC
  workflow_dispatch:
    inputs:
      open_pr:
        description: Open or update the rates PR
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-rates
  cancel-in-progress: false

jobs:
  update:
    name: Fetch rates and open PR
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch rates
        run: npm run rates -- --summary "$RUNNER_TEMP/rates-summary.md"

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Date
        id: date
        # Named after the morning the PR is reviewed: a run that starts before
        # midnight UTC still gets the next day's date.
        run: echo "today=$(date -u -d '+6 hours' +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Open or update the rates PR
        if: github.event_name == 'schedule' || inputs.open_pr
        uses: peter-evans/create-pull-request@v7
        with:
          branch: feature/bot/daily-rates-update
          delete-branch: true
          add-paths: src/data/rates.json
          commit-message: Update earn rates (${{ steps.date.outputs.today }})
          title: Daily earn rates update (${{ steps.date.outputs.today }})
          body-path: ${{ runner.temp }}/rates-summary.md
